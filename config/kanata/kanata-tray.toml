# For help with configuration see https://github.com/rszyma/kanata-tray/blob/main/README.md
# "$schema" = "https://raw.githubusercontent.com/rszyma/kanata-tray/v0.1.0/doc/config_schema.json"
'$schema' = 'https://raw.githubusercontent.com/rszyma/kanata-tray/main/doc/config_schema.json'

general.allow_concurrent_presets = false
defaults.tcp_port = 5829

[defaults.hooks]
# Hooks allow running custom commands on specific events (e.g. when starting preset).
# Documentation: https://github.com/rszyma/kanata-tray/blob/main/doc/hooks.md

[defaults.layer_icons]


[presets.'Default Preset']
# kanata runs as a root LaunchDaemon (see darwin.nix) for two reasons:
#   1. Karabiner's vHID server socket lives in a root-only dir
#      (/Library/Application Support/org.pqrs/tmp/rootonly/), so kanata
#      must be root to open the virtual HID device.
#   2. The tray drops privileges before spawning, which both breaks vHID
#      access and prevents the TCC Accessibility prompt from showing in a
#      non-GUI context. Running kanata as a system LaunchDaemon sidesteps
#      both issues (root + bypasses TCC).
# The tray connects via TCP (port 5829) for on/off/layer control.
# kanata_executable is intentionally omitted — do NOT add it back.
kanata_config = '/Users/matthias/Library/Application Support/kanata/kanata.kbd'
autorun = false
