# kanata-tray configuration.
# The tray is hardcoded to spawn and OWN the "kanata" process it starts
# (see https://github.com/rszyma/kanata-tray docs/hooks.md). Since kanata
# itself must run as a root LaunchDaemon (Karabiner vHID socket is
# root-only; see darwin.nix), the preset manages a lifecycle shim instead
# of kanata directly:
#   - kanata_executable points at a shim (/usr/local/bin/kanata-tray-shim)
#     that starts the root daemon via a narrow privileged helper and exits
#     as soon as the daemon's TCP port stops listening, so the tray icon
#     always reflects the REAL daemon state.
#   - hooks.post_stop: when the user pauses the preset, the tray stops the
#     shim; this hook then stops the root LaunchDaemon.

general.allow_concurrent_presets = false
defaults.tcp_port = 5829

[defaults.layer_icons]

[presets.'Default Preset']
kanata_executable = '/usr/local/bin/kanata-tray-shim'
kanata_config = '/Users/matthias/Library/Application Support/kanata/kanata.kbd'
# TCP port must match launchd.daemons.kanata in darwin.nix.
tcp_port = 5829
# Start managing the daemon automatically when the tray launches.
autorun = true

hooks.post-stop = [
  "sudo -n /usr/local/libexec/kanata-manage stop"
]
